app = "malote-web"
primary_region = "gru"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  PUBLIC_URL = "https://malote.io"
  SOURCE_REPO = "Malote-MCP/malote"
  # MCP, media and tokens are served by the confidential VM; the web app only hosts the panel.
  ENCLAVE_URL = "https://mcp.malote.io"
  ENCLAVE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
