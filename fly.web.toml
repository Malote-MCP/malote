app = "malote-web"
primary_region = "gru"

[build]
  dockerfile = "apps/web/Dockerfile"

[env]
  PUBLIC_URL = "https://malote-web.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
