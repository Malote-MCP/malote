# Publishes the worker image from main, built exactly like the reproducible-build check in ci.yml,
# with a signed provenance attestation. Anyone can verify an image the enclave runs with:
#   gh attestation verify oci://ghcr.io/malote-mcp/malote/worker@sha256:<digest> --repo Malote-MCP/malote
name: publish-worker

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        with:
          context: .
          file: apps/worker/Dockerfile
          no-cache: true
          tags: ghcr.io/malote-mcp/malote/worker:${{ github.sha }}
          outputs: type=image,push=true,rewrite-timestamp=true
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/malote-mcp/malote/worker
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - run: echo "### Published \`ghcr.io/malote-mcp/malote/worker@${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
