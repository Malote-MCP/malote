# The only way code reaches production: build from this public repo, attest, deploy by digest.
# Anyone can check that the digest reported on /api/transparency was built here:
#   gh attestation verify oci://ghcr.io/<owner>/<repo>/worker@sha256:<digest> --repo <owner>/<repo>
name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter "@malote/db..."
      - working-directory: packages/db
        run: node --import tsx src/migrate.ts
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    strategy:
      # The worker owns the WhatsApp sessions; roll it out before the web app that talks to it.
      max-parallel: 1
      matrix:
        app: [worker, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.app }}" >> "$GITHUB_OUTPUT"
      - id: epoch
        run: echo "value=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"
      # Same settings as the reproducible-build check in ci.yml, so the deployed digest is the checked one.
      - id: build
        uses: docker/build-push-action@v6
        env:
          SOURCE_DATE_EPOCH: ${{ steps.epoch.outputs.value }}
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          outputs: type=image,push=true,rewrite-timestamp=true
          build-args: |
            GIT_SHA=${{ github.sha }}
            SOURCE_DATE_EPOCH=${{ steps.epoch.outputs.value }}
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: superfly/flyctl-actions/setup-flyctl@1.6
      - run: flyctl deploy --config fly.${{ matrix.app }}.toml --image ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
